<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Monitor your websites and services with real-time alerts and comprehensive uptime tracking" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

    body { margin: 0; background-color: #0f172a; }
    .initial-loader { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #0f172a; }
    .initial-spinner { width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-top-color: #3b82f6; animation: spin 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <div id="root">
    <div class="initial-loader">
      <div class="initial-spinner"></div>
    </div>
  </div>
